# CI/CD Pipeline for IP Fabric Documentation
# Uses Docker image from registry.gitlab.com/ip-fabric/documentation/docs
# which contains all MkDocs plugins and mkdocs-material (community edition).
# No Insiders token needed — all features are now free.
# See: https://squidfunk.github.io/mkdocs-material/blog/2025/11/11/insiders-now-free-for-everyone/

variables:
  # SSH key for multirepo plugin (fetching docs from integration repos)
  GIT_SSH_COMMAND: 'ssh -o StrictHostKeyChecking=no -i "${CI_PROJECT_DIR}/.ssh/gitlab-ci"'
  GIT_STRATEGY: clone
  VALE_RELEASE: "https://github.com/errata-ai/vale/releases/download/v3.9.1/vale_3.9.1_Linux_64-bit.tar.gz"

# Docker image with all MkDocs dependencies pre-installed (built via Makefile docker-build)
image:
  name: registry.gitlab.com/ip-fabric/documentation/docs
  pull_policy: always

default:
  tags:
    - lowperf

# Deploy docs from main branch using mike (versioning tool)
# Builds site with mkdocs.yml (includes multirepo, social cards, etc.)
# and pushes to gh-pages branch which is then deployed to docs.ipfabric.io
build_main_pages:
  stage: deploy
  only:
    - main
  before_script:
    - git config --global user.email "devops+gl_ci_bot@ipfabric.io"
    - git config --global user.name "Bot IPFabric"
    - mkdir -pvm 0700 .ssh
    - echo "$ssh_deploy_key" > "$CI_PROJECT_DIR/.ssh/gitlab-ci"
    - chmod 0400 .ssh/gitlab-ci
    - git remote set-url origin "$(echo "$CI_REPOSITORY_URL" | sed -E 's#.*@([^/]+?(\:\d+)?)/#git@\1:#')"
  script:
    - git fetch origin gh-pages --depth=1
    - cp -v main_preamble.html overrides/main.html
    - mike deploy --push main

# Strict build validation for merge requests — catches broken links,
# missing files, and config errors before merge
strict_build_mr:
  stage: build
  only:
    - merge_requests
  before_script:
    - env
    - pwd
    - git config --global user.email "devops+gl_ci_bot@ipfabric.io"
    - git config --global user.name "Bot IPFabric"
    - mkdir -pvm 0700 .ssh
    - echo "$ssh_deploy_key" > "$CI_PROJECT_DIR/.ssh/gitlab-ci"
    - chmod 0400 .ssh/gitlab-ci
  script:
    - export DOC_TARGET=`mktemp -d`
    - mkdocs build -d "$DOC_TARGET" --strict
    - rm -rf "$DOC_TARGET"
  artifacts:
    expire_in: 1 week
    paths:
      - temp_multirepo/

# Vale syntax and style checker for Markdown
vale_mr:
  stage: test
  only:
    - merge_requests
  script:
    - make vale

# SEO and link checker for Markdown files
seo_lint_mr:
  stage: test
  only:
    - merge_requests
  script:
    - ./.gitlab/description_lint

# Danger gem for automated code review comments
danger:
  stage: build
  image: ruby:3.0
  only:
    - merge_requests
  script:
    - printenv
    - gem install danger
    - gem install danger-gitlab
    - "ls -al"
    - export CI_MERGE_REQUEST_IID=${CI_OPEN_MERGE_REQUESTS#*!}
    - danger --fail-on-errors=true

# AI-powered documentation review: Vale linter (Hemingway rules) + Claude
# Runs Vale on changed files, feeds findings to Claude for rewrite suggestions,
# and posts a single MR comment. Non-blocking.
ai_review_mr:
  stage: test
  only:
    - merge_requests
  allow_failure: true
  script:
    - make /tmp/vale/vale
    - pip install --quiet -r .gitlab/requirements-ai-review.txt
    - python3 .gitlab/ai_review.py
