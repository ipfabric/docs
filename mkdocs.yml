site_name: IP Fabric Documentation Portal
site_url: https://docs.ipfabric.io
repo_url: https://github.com/ipfabric/docs
repo_name: ipfabric/docs
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.png
  custom_dir: overrides
  features:
    - content.action.edit
    - content.code.copy
    - content.code.annotate
    #- navigation.expand
    - navigation.footer
    - navigation.path
    - navigation.tabs
    - navigation.tracking
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - toc.follow

  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: ipfabric
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - mdx_truly_sane_lists
  - smarty
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tilde

extra_css:
  - stylesheets/theme.css

extra:
  analytics:
    provider: google
    property: G-35CFCZJ2PW
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/emoticon-happy-outline
          name: This page was helpful
          data: 1
          note: >-
            Thanks for your feedback!
        - icon: material/emoticon-sad-outline
          name: This page could be improved
          data: 0
          note: >-
            Thanks for your feedback! Help us improve this page by
            using our <a href="https://ipfabric.atlassian.net/servicedesk/customer/portal/1" target="_blank" rel="noopener">support portal</a>.
  consent:
    title: Cookie consent
    description: >-
      We use cookies to recognize your repeated visits and preferences, as well
      as to measure the effectiveness of our documentation and whether users
      find what they're searching for. With your consent, you're helping us to
      make our documentation better.
  generator: false
  social:
    - icon: fontawesome/brands/facebook
      link: https://www.facebook.com/ipfabric.io
    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/channel/UCLztlukjD9RKFGkrKgxMT1w/featured
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/IPFabric
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/company/ip-fabric/
  version:
    provider: mike

# Plugins configuration — single unified config (previously split into mkdocs.yml + mkdocs_insiders.yml)
# All features from Material Insiders are now in the community edition (v9.5+).
# See: https://squidfunk.github.io/mkdocs-material/blog/2025/11/11/insiders-now-free-for-everyone/
plugins:
  # Navigation ordering via .nav.yml files in docs directories
  - awesome-nav:
      filename: .nav.yml
  # Shows "last updated" date on each page (from git commit history)
  - git-revision-date-localized:
      strict: false
  # Per-page metadata overrides (formerly Insiders-only)
  - meta:
  # Full-text search with improved tokenization for multi-word queries
  - search:
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'
  # Auto-generated social/OpenGraph cards for link previews (formerly Insiders-only)
  - social:
      cards_layout: default/variant
      cards_layout_options:
        background_color: "#143352"
        color: "#FFFFFF"
  # Page tagging support (formerly Insiders-only)
  - tags:
  # Lightbox for images — click to zoom
  - glightbox:
      zoomable: true
  # Exclude pages tagged as draft/excluded from the build
  - mkdocs_exclude_tagged_files:
      tags_to_exclude:
        - draft
        - excluded
  # Import docs from external integration repositories (nornir, postman, python SDK, ServiceNow)
  # Requires SSH deploy key (docs_ci_bot) in each target repository
  - multirepo:
      cleanup: false
      temp_dir: temp_multirepo
      repos:
        - section: "nornir"
          section_path: "integrations"
          import_url: "https://gitlab.com/ip-fabric/integrations/ipfabric_nornir.git?branch=main"
        - section: "postman"
          section_path: "integrations"
          import_url: "https://gitlab.com/ip-fabric/integrations/postman.git?branch=main"
        - section: "python"
          section_path: "integrations"
          import_url: "https://gitlab.com/ip-fabric/integrations/python-ipfabric.git?branch=main"
        - section: "service-now"
          section_path: "integrations"
          import_url: "https://gitlab.com/ip-fabric/integrations/ipfabric-snow.git?branch=main"
  # Open external links in new tab
  - open-in-new-tab:
  # mike: versioning tool — builds and deploys versioned docs to gh-pages branch
  - mike:
      version_selector: true
      css_dir: css
      javascript_dir: js
      canonical_version: latest
